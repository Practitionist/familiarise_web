# SonarQube Cloud (sonarcloud.io) config for CI-BASED analysis (sonar-scanner).
# NOTE: Automatic Analysis (currently enabled) IGNORES this file — it reads
# `.sonarcloud.properties` instead (see that file for the exclusions in effect
# today). This file is staged for when we add a CI sonar-scanner step to unlock
# coverage; org + projectKey are confirmed from the Sonar project.
sonar.organization=practitionist
sonar.projectKey=Practitionist_familiarise_web

# --- What to analyze -------------------------------------------------------
sonar.sources=app,lib,components,utils,hooks,providers,schemas,actions,jobs
sonar.tests=__tests__,tests

# --- Coverage (Jest v8 -> lcov) --------------------------------------------
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# --- Exclusions ------------------------------------------------------------
# Generated output, vendored code, type decls, seeds/migrations, and non-app assets.
sonar.exclusions=**/node_modules/**,.next/**,coverage/**,**/*.d.ts,prisma/migrations/**,prisma/seedFiles/**,public/**,emails/**,docs/**,load-tests/**,testsprite_tests/**
# Test code should not count toward coverage-of-app metrics.
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,prisma/**,scripts/**,jobs/**,**/*.config.*
