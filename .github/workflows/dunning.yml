name: Dunning

# #779 §A — daily invoice dunning: flips ISSUED→OVERDUE past due date and
# sends escalating 7-day reminders (cap 3). Runs after the invoice-gen +
# expire-contracts crons so invoices are in their final state when read.

on:
  schedule:
    # 23:30 UTC = 05:00 IST. Quiet slot — after the 03:00 UTC
    # expire-contracts / sso-cert crons; no other cron fires at 23:xx.
    - cron: "30 23 * * *"
  workflow_dispatch: # Allow manual triggering

jobs:
  dunning:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      # #476 — fail-closed cron lock: without these the job refuses to run.
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      NOVU_SECRET_KEY: ${{ secrets.NOVU_SECRET_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run dunning job
        run: npx tsx jobs/billing/dunning.ts

      - name: Notify on failure
        if: failure()
        env:
          SLACK_OPS_WEBHOOK_URL: ${{ secrets.SLACK_OPS_WEBHOOK_URL }}
        run: bash scripts/ci/notify-ops-failure.sh "dunning"
