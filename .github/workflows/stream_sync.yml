name: Sync Stale Stream Users

on:
  schedule:
    # Runs at 03:30 UTC (9:00 AM IST) every day
    - cron: "30 3 * * *"
  workflow_dispatch: # Allows manual triggering from the GitHub Actions UI

jobs:
  sync_stream_users:
    runs-on: ubuntu-latest
    env: # Environment variables available to all steps in this job
      # These must be set as GitHub secrets in your repository settings
      # Settings > Secrets and variables > Actions > New repository secret
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_STREAM_API_KEY: ${{ secrets.NEXT_PUBLIC_STREAM_API_KEY }}
      STREAM_API_SECRET: ${{ secrets.STREAM_API_SECRET }}
      # NODE_ENV: production # Optional: set if your script behaves differently in prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20" # Specify your Node.js version, e.g., 18, 20
          cache: "npm" # or 'yarn' if you use yarn

      - name: Install dependencies
        run: npm install # or yarn install

      - name: Run Stream User Sync Script
        run: |
          echo "Running Stream user sync script..."
          # Assuming ts-node is a dev dependency or installed globally in the CI environment
          # If you compile TS to JS as part of a build step, you might run the .js file directly:
          # e.g., node dist/jobs/run-stream-sync.js
          npx ts-node jobs/run-stream-sync.ts
        # No need to check HTTP response code here, script will exit with 0 or 1

      - name: Sync Complete
        if: success()
        run: echo "Stream user sync script completed successfully."

      - name: Sync Failed
        if: failure()
        run: echo "Stream user sync script failed."
