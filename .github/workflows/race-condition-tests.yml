name: Race Condition Tests

on:
  pull_request:
    branches: [dev, staging, prod]
    types: [opened, synchronize, reopened]

jobs:
  race-condition-tests:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # Required for distributed locking in race condition tests
      # These must be set as GitHub secrets in your repository settings
      # Settings > Secrets and variables > Actions > New repository secret
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Race Condition Tests
        run: npm run test:race
        timeout-minutes: 20

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: race-condition-test-reports
          path: tests/typescript/race-conditions/results/reports/
          retention-days: 30
