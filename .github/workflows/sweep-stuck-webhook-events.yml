name: Sweep Stuck Webhook Events

# B5 (#785, task #10) — re-drives WebhookEvent rows left processed=false after an
# after()-callback crash, so the money side-effects land instead of relying on a
# gateway redelivery that never comes. Runs every 10 minutes.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # Allow manual triggering

jobs:
  sweep-stuck-webhook-events:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Database connection (required for Prisma). Optional integrations the
      # replayed handlers may touch (Novu, gateway lookups) degrade gracefully
      # when absent, matching the other money crons.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      # #476 — fail-closed cron lock: without these the job refuses to run.
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Sweep stuck webhook events
        run: npx tsx jobs/cleanup/sweep-stuck-webhook-events.ts

      - name: Notify on failure
        if: failure()
        run: |
          echo "Stuck-webhook sweep job failed"
