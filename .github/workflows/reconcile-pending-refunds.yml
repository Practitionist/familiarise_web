name: Reconcile Pending Refunds

on:
  schedule:
    # Run every 15 minutes
    - cron: "*/15 * * * *"
  workflow_dispatch: # Allow manual triggering

jobs:
  reconcile-refunds:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Database connection (required for Prisma)
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

      # Payment gateway credentials for querying refund status
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
      RAZORPAY_SECRET: ${{ secrets.RAZORPAY_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run refund reconciliation
        run: npx tsx jobs/refunds/reconcile-pending-refunds.ts

      - name: Notify on failure
        if: failure()
        env:
          SLACK_OPS_WEBHOOK_URL: ${{ secrets.SLACK_OPS_WEBHOOK_URL }}
        run: bash scripts/ci/notify-ops-failure.sh "reconcile-pending-refunds"
