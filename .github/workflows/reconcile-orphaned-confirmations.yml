name: Reconcile Orphaned Confirmations

on:
  schedule:
    # Run every 30 minutes
    - cron: "13-59/30 * * * *"
  workflow_dispatch: # Allow manual triggering

jobs:
  reconcile-orphaned-confirmations:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Database connection (required for Prisma)
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      # #476 — fail-closed cron lock: without these the job refuses to run.
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

      # Payment gateway credentials
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      # RAZORPAY_SECRET is the canonical name (lib/payments/core/razorpay.ts
      # reads only that one); RAZORPAY_KEY_SECRET stays for the legacy readers
      # in scripts/. Both source the same repo secret — see #677 PM-1.
      RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
      RAZORPAY_SECRET: ${{ secrets.RAZORPAY_SECRET }}
      RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run payment status reconciliation
        run: npx --yes tsx@4.23.1 jobs/payments/reconcile-orphaned-confirmations.ts

      - name: Notify on failure
        if: failure()
        env:
          SLACK_OPS_WEBHOOK_URL: ${{ secrets.SLACK_OPS_WEBHOOK_URL }}
          # Fallback sink — Slack has never been provisioned, so this is
          # what actually pages today. See 07-required-secrets.md.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: bash scripts/ci/notify-ops-failure.sh "reconcile-orphaned-confirmations"
