name: Sync Payment to Earnings

on:
  schedule:
    # Run every hour
    - cron: "0 * * * *"
  workflow_dispatch: # Allow manual triggering

jobs:
  sync-payment-earnings:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Database connection (required for Prisma)
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      # #476 — fail-closed cron lock: without these the job refuses to run.
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run payment-earning sync
        run: npx tsx jobs/earnings/sync-payment-earnings.ts

      - name: Notify on failure
        if: failure()
        env:
          SLACK_OPS_WEBHOOK_URL: ${{ secrets.SLACK_OPS_WEBHOOK_URL }}
        run: bash scripts/ci/notify-ops-failure.sh "sync-payment-earnings"
