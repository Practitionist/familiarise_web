name: Mark Expired Recordings

on:
  schedule:
    # Daily 03:20 UTC. #709 — off the 03:00 pile-up.
    - cron: "20 3 * * *"
  workflow_dispatch: # Allow manual triggering

jobs:
  mark-expired-recordings:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # #476 cron locks load lib/redis at import — every job entry needs these
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Mark expired recordings
        run: npx tsx jobs/stream/mark-expired-recordings.ts

      - name: Notify on failure
        if: failure()
        run: |
          echo "Mark expired recordings job failed"
