name: Cron — Weekly & Statutory Fleet

permissions:
  contents: read

on:
  schedule:
    # Weekly Sunday 00:25 UTC: webhook event archival & DPDP consent retention sweeper
    - cron: "25 0 * * 0"
    # Weekly Monday 20:00 UTC: create consultant & org payout batches
    - cron: "0 20 * * 1"
    # Weekly Monday 21:00 UTC: process approved payout batches
    - cron: "0 21 * * 1"
    # Monthly 1st 04:00 UTC: settle invoice accruals
    - cron: "0 4 1 * *"
    # Monthly 3rd 01:40 UTC: GST outward-supplies register export
    - cron: "40 1 3 * *"
    # Monthly 1st 03:10 UTC: referral credit breakage
    - cron: "10 3 1 * *"
    # Quarterly 5th of Jan/Apr/Jul/Oct 01:20 UTC: TDS Form 26Q return draft export
    - cron: "20 1 5 1,4,7,10 *"
  workflow_dispatch:
    inputs:
      job:
        description: "Job slug to run (or 'all' to run every weekly/statutory job)"
        required: false
        default: "all"
        type: string
      period_start:
        description: "GST register period start (YYYY-MM-DD, inclusive)"
        required: false
        type: string
      period_end:
        description: "GST register period end (YYYY-MM-DD, exclusive)"
        required: false
        type: string
      financialYear:
        description: "TDS return financial year, e.g. '2026-27'"
        required: false
        type: string
      quarter:
        description: "TDS return fiscal quarter 1-4"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.schedule || inputs.job || 'manual' }}
  cancel-in-progress: false

jobs:
  weekly-and-statutory:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN || secrets.SENTRY_DSN }}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: production
      ENABLE_LIVE_PAYOUTS: ${{ vars.ENABLE_LIVE_PAYOUTS }}
      ENABLE_DUNNING_SUSPEND: ${{ vars.ENABLE_DUNNING_SUSPEND }}
      RATE_CARD_SCOPED_RESOLUTION: ${{ vars.RATE_CARD_SCOPED_RESOLUTION }}
      TDS_ENGINE: ${{ vars.TDS_ENGINE }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DPDP_SWEEPER_DELETE: ${{ secrets.DPDP_SWEEPER_DELETE }}
      RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
      RAZORPAY_SECRET: ${{ secrets.RAZORPAY_SECRET }}
      RAZORPAYX_ACCOUNT_NUMBER: ${{ secrets.RAZORPAYX_ACCOUNT_NUMBER }}
      ENABLE_CONSOLIDATED_INVOICE: ${{ secrets.ENABLE_CONSOLIDATED_INVOICE }}
      PLATFORM_GSTIN: ${{ secrets.PLATFORM_GSTIN }}
      SUPPLIER_STATE_CODE: ${{ secrets.SUPPLIER_STATE_CODE }}
      PLATFORM_INVOICE_PREFIX: ${{ secrets.PLATFORM_INVOICE_PREFIX }}
      GST_REGISTER_CSV_OUT: gst-outward-register.csv
      PAN_ENCRYPTION_KEY: ${{ secrets.PAN_ENCRYPTION_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npx --no-install prisma generate

      - name: Validate dispatch job slug
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_JOB: ${{ inputs.job }}
        run: |
          case "${INPUT_JOB}" in
            ""|all|archive-webhook-events|consent-retention-sweeper|create-payout-batch|process-payouts|settle-invoice-accruals|expire-referral-credits|gst-outward-register-export|tds-26q-draft-export|tds-return-draft)
              ;;
            *)
              echo "::error::Unknown weekly/statutory job slug '${INPUT_JOB}'"
              exit 1
              ;;
          esac

      - name: Archive webhook events
        id: archive-webhook-events
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '25 0 * * 0') ||
          (github.event_name == 'workflow_dispatch' && (inputs.job == '' || inputs.job == 'all' || inputs.job == 'archive-webhook-events'))
        timeout-minutes: 10
        continue-on-error: true
        env:
          APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cleanup/archive-webhook-events"

      - name: Consent retention sweeper
        id: consent-retention-sweeper
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '25 0 * * 0') ||
          (github.event_name == 'workflow_dispatch' && (inputs.job == '' || inputs.job == 'all' || inputs.job == 'consent-retention-sweeper'))
        timeout-minutes: 10
        continue-on-error: true
        run: node_modules/.bin/tsx jobs/compliance/consent-retention-sweeper.ts

      - name: Create payout batch
        id: create-payout-batch
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '0 20 * * 1') ||
          (github.event_name == 'workflow_dispatch' && (inputs.job == '' || inputs.job == 'all' || inputs.job == 'create-payout-batch'))
        timeout-minutes: 10
        continue-on-error: true
        run: node_modules/.bin/tsx jobs/payouts/create-payout-batch.ts

      - name: Process payouts
        id: process-payouts
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '0 21 * * 1') ||
          (github.event_name == 'workflow_dispatch' && (inputs.job == '' || inputs.job == 'all' || inputs.job == 'process-payouts'))
        timeout-minutes: 10
        continue-on-error: true
        run: node_modules/.bin/tsx jobs/payouts/process-payouts.ts

      - name: Settle invoice accruals
        id: settle-invoice-accruals
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '0 4 1 * *') ||
          (github.event_name == 'workflow_dispatch' && (inputs.job == '' || inputs.job == 'all' || inputs.job == 'settle-invoice-accruals'))
        timeout-minutes: 10
        continue-on-error: true
        run: node_modules/.bin/tsx jobs/billing/settle-invoice-accruals.ts

      - name: Expire referral credits (breakage)
        id: expire-referral-credits
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '10 3 1 * *') ||
          (github.event_name == 'workflow_dispatch' && (inputs.job == '' || inputs.job == 'all' || inputs.job == 'expire-referral-credits'))
        timeout-minutes: 10
        continue-on-error: true
        env:
          APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cleanup/expire-referral-credits"

      - name: Export GST outward-supplies register
        id: gst-outward-register-export
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '40 1 3 * *') ||
          (github.event_name == 'workflow_dispatch' && (inputs.job == '' || inputs.job == 'all' || inputs.job == 'gst-outward-register-export'))
        timeout-minutes: 10
        continue-on-error: true
        env:
          GST_REGISTER_PERIOD_START: ${{ inputs.period_start }}
          GST_REGISTER_PERIOD_END: ${{ inputs.period_end }}
        run: node_modules/.bin/tsx jobs/compliance/gst-outward-register-export.ts

      - name: Upload GST outward-supplies register CSV
        if: always() && steps.gst-outward-register-export.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: gst-outward-register
          path: gst-outward-register.csv
          retention-days: 90
          if-no-files-found: warn

      - name: Export TDS Form 26Q return draft
        id: tds-26q-draft-export
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '20 1 5 1,4,7,10 *') ||
          (github.event_name == 'workflow_dispatch' && (inputs.job == '' || inputs.job == 'all' || inputs.job == 'tds-26q-draft-export' || inputs.job == 'tds-return-draft'))
        timeout-minutes: 10
        continue-on-error: true
        env:
          TDS_RETURN_FY: ${{ inputs.financialYear }}
          TDS_RETURN_QUARTER: ${{ inputs.quarter }}
        run: node_modules/.bin/tsx jobs/compliance/tds-26q-draft-export.ts

      - name: Check job outcomes and notify on failure
        if: always()
        env:
          SLACK_OPS_WEBHOOK_URL: ${{ secrets.SLACK_OPS_WEBHOOK_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          EXPECTED_SENTRY_PROJECT_ID: ${{ vars.EXPECTED_SENTRY_PROJECT_ID }}
          JOB_STATUS: ${{ job.status }}
        run: |
          failed=0
          for entry in \
            "archive-webhook-events:${{ steps.archive-webhook-events.outcome }}" \
            "consent-retention-sweeper:${{ steps.consent-retention-sweeper.outcome }}" \
            "create-payout-batch:${{ steps.create-payout-batch.outcome }}" \
            "process-payouts:${{ steps.process-payouts.outcome }}" \
            "settle-invoice-accruals:${{ steps.settle-invoice-accruals.outcome }}" \
            "expire-referral-credits:${{ steps.expire-referral-credits.outcome }}" \
            "gst-outward-register-export:${{ steps.gst-outward-register-export.outcome }}" \
            "tds-26q-draft-export:${{ steps.tds-26q-draft-export.outcome }}"
          do
            job_name="${entry%%:*}"
            outcome="${entry#*:}"
            if [ "$outcome" = "failure" ] || [ "$outcome" = "cancelled" ]; then
              echo "::error::Weekly/statutory job ${job_name} ended with ${outcome}"
              bash scripts/ci/notify-ops-failure.sh "${job_name}" || true
              failed=1
            fi
          done
          if { [ "$JOB_STATUS" = "failure" ] || [ "$JOB_STATUS" = "cancelled" ]; } && [ "$failed" -eq 0 ]; then
            bash scripts/ci/notify-ops-failure.sh "cron-weekly" || true
            exit 1
          fi
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
