# The slim gate for release pull requests into prod. ci.yaml stays disabled while
# dev pull requests are gated by the Netlify preview build and local checks; its
# own release run costs about 26 minutes, this one about 8.
name: Release Checks

permissions:
  contents: read

on:
  pull_request:
    branches: [prod]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-checks:
    name: Release checks
    # Forks run too: the job needs no secrets, and a skipped required check
    # counts as passing. Drafts skip; they cannot merge.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7
        with:
          # changedSince needs the merge base with prod.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        run: node_modules/.bin/prisma generate

      - name: TypeScript Check
        run: node_modules/.bin/tsc --noEmit
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: ESLint
        run: npm run lint

      - name: Cron job coverage
        run: npm run cron:coverage

      - name: Unit tests (changed since prod)
        run: node_modules/.bin/jest --changedSince=origin/prod --passWithNoTests --coverage=false
