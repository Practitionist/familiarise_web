name: DB Live Drift

permissions:
  contents: read

# Read-only: `prisma migrate diff` of the shared live DB against dev's schema,
# plus the release gate on every pull request into prod.
on:
  schedule:
    - cron: "3 7 * * *"
  workflow_dispatch:
  pull_request:
    branches: [prod]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'scheduled' }}
  cancel-in-progress: false

jobs:
  # Release gate: fails while the release's schema declares a table, column or
  # enum value the live database lacks; sidecar objects and database-ahead drift are ignored.
  # A fork's pull request gets no secrets and so no run; the cutter's pasted --live output is its record.
  release-schema-gate:
    name: Release schema gate
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Schema not ahead of the live database (read-only)
        run: |
          test -n "$DATABASE_URL" || { echo "::error title=Release schema gate::DATABASE_URL secret is not set"; exit 1; }
          node_modules/.bin/tsx scripts/ci/check-db-schema-required.ts --live

  db-live-drift:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npx --no-install prisma generate

      - name: Live drift check (read-only)
        # check-db-sidecars.ts exits 0 when DATABASE_URL is unset, so require it here.
        run: |
          test -n "$DATABASE_URL" || { echo "::error title=DB live drift::DATABASE_URL secret is not set"; exit 1; }
          node_modules/.bin/tsx scripts/ci/check-db-live-drift.ts
          node_modules/.bin/tsx scripts/ci/check-db-sidecars.ts

      - name: Notify on failure
        if: failure()
        env:
          SLACK_OPS_WEBHOOK_URL: ${{ secrets.SLACK_OPS_WEBHOOK_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          EXPECTED_SENTRY_PROJECT_ID: ${{ vars.EXPECTED_SENTRY_PROJECT_ID }}
        run: bash scripts/ci/notify-ops-failure.sh "db-live-drift"
