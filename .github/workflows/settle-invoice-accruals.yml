name: Settle Invoice Accruals

# #771 / #749 — cycle-close cron: rolls each org's unbilled INVOICE_ACCRUAL
# / OVERAGE_INVOICE_ACCRUAL bookings into an OrganizationInvoice. Financial
# cron (see FINANCIAL_JOB_NAMES) — skipped in DEGRADED maintenance.

on:
  schedule:
    # 01:30 UTC = 07:00 IST. GitHub Actions `schedule` interprets cron in
    # UTC. Runs 30 min after generate-subscription-invoices (01:00 UTC) so
    # the accrual rollup reads after subscription invoices have settled.
    - cron: "30 1 * * *"
  workflow_dispatch: # Allow manual triggering

jobs:
  settle-invoice-accruals:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run settle invoice accruals job
        run: npx tsx jobs/billing/settle-invoice-accruals.ts

      - name: Notify on failure
        if: failure()
        run: |
          echo "Settle invoice accruals cron failed"
          # TODO: wire to #ops-alerts Slack channel.
