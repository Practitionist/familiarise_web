name: Reconcile Document Storage

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch: # Allow manual triggering

jobs:
  reconcile-document-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Database connection (required for Prisma)
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

      # Supabase credentials (required for storage operations)
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Reconcile document storage
        run: npx tsx jobs/cleanup/reconcile-document-storage.ts

      - name: Notify on failure
        if: failure()
        run: |
          echo "Document storage reconciliation job failed"
          # Add notification logic here (Slack, email, etc.)
