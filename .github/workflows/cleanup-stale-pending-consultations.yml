name: Cleanup Stale Pending Consultations

on:
  schedule:
    # Run hourly
    - cron: "30 * * * *"
  workflow_dispatch: # Allow manual triggering

jobs:
  cleanup-stale-pending-consultations:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Database connection (required for Prisma)
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Cleanup stale pending consultations
        run: npx tsx jobs/cleanup-stale-pending-consultations.ts

      - name: Notify on failure
        if: failure()
        run: |
          echo "Stale pending consultations cleanup job failed"
          # Add notification logic here (Slack, email, etc.)
