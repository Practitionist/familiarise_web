name: Cron Heartbeat

# Watches the workflows GitHub Actions schedules (db-live-drift, security-audit)
# and fails when one has stopped starting. It does NOT watch runtime jobs: those
# run on the Netlify ticker and are watched from outside Actions by
# /api/health/jobs, the ticker heartbeat and the daily ops digest.

on:
  schedule:
    - cron: "40 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Read-only access to the Actions API; no repo write is needed or wanted.
permissions:
  contents: read
  actions: read

jobs:
  cron-heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        # --ignore-scripts: this job never touches the database, so it does not
        # need the `postinstall` prisma generate, and skipping lifecycle scripts
        # keeps a scheduled job that runs with an Actions token off the
        # arbitrary-code-execution path entirely.
        run: npm ci --ignore-scripts

      # No prisma generate and no lock: a read-only Actions API check.
      - name: Check that every Actions-scheduled workflow is still firing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node_modules/.bin/tsx scripts/ci/check-cron-heartbeat.ts

      - name: Notify on failure
        if: failure()
        env:
          SLACK_OPS_WEBHOOK_URL: ${{ secrets.SLACK_OPS_WEBHOOK_URL }}
          # Fallback sink — Slack has never been provisioned, so this is
          # what actually pages today. See 07-required-secrets.md.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # Non-secret identifier the guard compares SENTRY_DSN against.
          # vars.* is NOT auto-injected into a step env; it must be mapped here.
          EXPECTED_SENTRY_PROJECT_ID: ${{ vars.EXPECTED_SENTRY_PROJECT_ID }}
        run: bash scripts/ci/notify-ops-failure.sh "cron-heartbeat"
