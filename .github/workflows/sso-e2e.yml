# Focused signal for the SSO end-to-end suites.
#
# ## Why this is a separate workflow and not a step in ci.yaml
#
# These three suites are the only tests that *boot an identity provider*. That
# makes them the only tests in the repo that can hang rather than fail: a mock
# IdP that never binds, a listener that is never closed, a socket that outlives
# its suite. In `test-and-build` that would be indistinguishable from a slow
# build, and it would burn the job's whole budget behind a `Unit Tests` step
# that looks identical to every other one.
#
# Run alone, with a 10-minute ceiling, a wedged harness costs ten minutes and
# produces a red X on a job whose name says "SSO E2E". That is the entire
# reason this file exists.
#
# ## It is not the only place these run
#
# `npm run test` collects everything under `__tests__/`, so the main CI job
# still runs all three on every push. This workflow adds a fast, isolated,
# bounded signal — it does not take coverage away from anywhere.
#
# ## No database, no .env, no Redis, no secrets
#
# The suites use a `PrismaLike` double and a loopback mock IdP, so nothing here
# touches Postgres, Upstash or the vault. That is deliberate: a suite that needs
# the full environment cannot be a reliable first signal for a protocol
# handshake, and it would be skipped on forks for want of secrets.
#
# `--coverage=false` because `jest.config.ts` sets `collectCoverage: true`, and
# instrumenting the whole codebase to report on three files is slow, noisy and
# memory-hungry. `--runInBand` for the same reason — three suites, no benefit
# from workers, and a much smaller resident set.

name: SSO E2E

concurrency:
  group: sso-e2e-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    # Mirrors ci.yaml, including `feat/**` — a stacked train is the normal
    # shape for large work here and a sub-PR on a feature branch must not run
    # zero checks (#1268).
    branches: [dev, staging, prod, "feat/**"]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  sso-e2e:
    name: SSO E2E
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: SSO end-to-end suites
        # The P0 regression suite first: if `buildStoredSamlConfig` ever loses
        # `spMetadata` again, that is the failure worth seeing immediately.
        run: >-
          npx jest
          __tests__/sso/saml.e2e.test.ts
          __tests__/sso/oidc.e2e.test.ts
          __tests__/sso/jit.e2e.test.ts
          --coverage=false
          --runInBand
