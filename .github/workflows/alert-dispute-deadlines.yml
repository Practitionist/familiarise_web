name: Alert Dispute Deadlines

on:
  schedule:
    # Run hourly
    - cron: "0 * * * *"
  workflow_dispatch: # Allow manual triggering

jobs:
  alert-dispute-deadlines:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Database connection (required for Prisma)
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Check dispute deadlines
        run: npx tsx jobs/disputes/alert-dispute-deadlines.ts

      - name: Notify on critical disputes
        if: failure()
        run: |
          echo "CRITICAL: Dispute deadlines require immediate attention!"
          # Add notification logic here (Slack, email, PagerDuty, etc.)
