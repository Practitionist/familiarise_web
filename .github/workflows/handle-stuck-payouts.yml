name: Handle Stuck Payouts

on:
  schedule:
    # Run every 4 hours
    - cron: "0 */4 * * *"
  workflow_dispatch: # Allow manual triggering

jobs:
  handle-stuck-payouts:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Database connection (required for Prisma)
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

      # Payment gateway credentials for querying payout status
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
      RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run stuck payouts handler
        run: npx tsx jobs/handle-stuck-payouts.ts

      - name: Notify on failure
        if: failure()
        run: |
          echo "Stuck payouts handler failed"
          # Add notification logic here (Slack, email, etc.)
