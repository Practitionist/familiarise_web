name: Cleanup Invalid Appointments

on:
  schedule:
    # Run every hour
    - cron: "12 * * * *"
  workflow_dispatch: # Allow manual triggering

jobs:
  cleanup-invalid-appointments:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Database connection (required for Prisma)
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # #476 cron locks load lib/redis at import — every job entry needs these
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run invalid appointments cleanup
        run: npx --yes tsx@4.23.1 jobs/appointments/cleanup-invalid-appointments.ts

      - name: Notify on failure
        if: failure()
        env:
          SLACK_OPS_WEBHOOK_URL: ${{ secrets.SLACK_OPS_WEBHOOK_URL }}
          # Fallback sink — Slack has never been provisioned, so this is
          # what actually pages today. See 07-required-secrets.md.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: bash scripts/ci/notify-ops-failure.sh "cleanup-invalid-appointments"
