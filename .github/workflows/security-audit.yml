name: Supply-Chain Security Audit

permissions:
  contents: read

on:
  schedule:
    # Weekly on Monday at 07:00 UTC (#1885): catches newly-published advisories
    # against an unchanged lockfile between PRs.
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  security-audit:
    name: Production Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Run production supply-chain security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Notify ops on failure
        if: failure()
        env:
          SLACK_OPS_WEBHOOK_URL: ${{ secrets.SLACK_OPS_WEBHOOK_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          EXPECTED_SENTRY_PROJECT_ID: ${{ vars.EXPECTED_SENTRY_PROJECT_ID }}
        run: bash scripts/ci/notify-ops-failure.sh "security-audit"
