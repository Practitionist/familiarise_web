name: Process Data Exports

on:
  schedule:
    # Every 10 minutes. Exports are async, low volume, but the
    # requester is waiting on an email so latency budget is single-
    # digit minutes.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  process-data-exports:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DATA_EXPORT_BUCKET: org-exports
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsx jobs/cleanup/process-data-exports.ts
      - if: failure()
        run: echo "Data export worker failed"
