name: Create Payout Batch

on:
  schedule:
    # Run weekly on Mondays at 8:00 PM UTC (1:30 AM IST next day)
    - cron: "0 20 * * 1"
  workflow_dispatch: # Allow manual triggering

jobs:
  create-payout-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Database connection (required for Prisma)
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run create payout batch job
        run: npx tsx jobs/payouts/create-payout-batch.ts

      - name: Notify on failure
        if: failure()
        run: |
          echo "Create payout batch job failed"
          # Add notification logic here (Slack, email, etc.)
