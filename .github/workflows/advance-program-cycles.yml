name: Advance Program Cycles

on:
  schedule:
    # 02:15 UTC — ahead of auto-renew-contracts (02:30) and expire-contracts
    # (03:00) so assignments roll while their governing contract is still
    # ACTIVE, before any contract-side state moves under them (#779).
    - cron: "15 2 * * *"
  workflow_dispatch: # Allow manual triggering

jobs:
  advance-program-cycles:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run program-cycle-advance job
        run: npx tsx jobs/billing/advance-program-cycles.ts

      - name: Notify on failure
        if: failure()
        run: |
          echo "Program-cycle-advance cron failed"
          # TODO: wire to #ops-alerts Slack channel.
