name: Alert Orphaned Payments

on:
  schedule:
    # Run every 6 hours
    - cron: "30 */6 * * *"
  workflow_dispatch: # Allow manual triggering

jobs:
  alert-orphaned-payments:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Database connection (required for Prisma)
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # #476 cron locks load lib/redis at import — every job entry needs these
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run orphaned payments alert
        run: npx tsx jobs/alerts/alert-orphaned-payments.ts

      - name: Notify on critical findings
        if: failure()
        run: |
          echo "CRITICAL: Orphaned payments detected!"
          echo "Customers were charged but have no appointment."
          echo "Manual recovery is required."
          # Add notification logic here (Slack, email, etc.)
