name: Sweep Abandoned Overage Charges

# #785 (task #25) — FAILs never-paid PENDING CHARGE_MEMBER overage side-charges so
# they stop counting toward the per-cycle circuit-breaker ceiling. Runs daily.

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

jobs:
  sweep-abandoned-overage-charges:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Sweep abandoned overage charges
        run: npx tsx jobs/cleanup/sweep-abandoned-overage-charges.ts

      - name: Notify on failure
        if: failure()
        run: |
          echo "Abandoned overage-charge sweep job failed"
