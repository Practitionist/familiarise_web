name: PR Checks and Deploy

on:
  pull_request:
    branches: [ dev,staging,prod]
    types: [opened, synchronize, reopened]

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prettier Check
        run: npx prettier --check "app/**/*.{js,jsx,ts,tsx,json,css,scss,md}"

      - name: ESLint Check
        run: npx eslint .

      - name: TypeScript Check
        run: npx tsc --noEmit

  deploy-preview:
    needs: quality-checks
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build 

      - name: Check Netlify Credentials
        run: |
          if [ -z "${{ secrets.NETLIFY_AUTH_TOKEN }}" ] || [ -z "${{ secrets.NETLIFY_SITE_ID }}" ]; then
            echo "Error: Netlify credentials not provided. Please set NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID secrets in your repository settings."
            exit 1
          fi

      - name: Deploy to Netlify
        id: deploy-netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: .next
          production-branch: prod
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy Preview from PR"
          enable-pull-request-comment: false
          enable-commit-comment: true
          overwrites-pull-request-comment: true
          fails-without-credentials: true
          alias: deploy-preview-${{ github.event.number }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5

      - name: Create Deployment Status Comment
        if: github.event_name == 'pull_request' && steps.deploy-netlify.outputs.NETLIFY_URL != ''
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const deployUrl = '${{ steps.deploy-netlify.outputs.NETLIFY_URL }}';
            const logsUrl = '${{ steps.deploy-netlify.outputs.NETLIFY_LOGS_URL }}';
            
            const body = `🚀 Netlify Deployment Status
            
            🔍 Inspect: ${logsUrl}
            ✅ Preview: ${deployUrl}
            
            *Deployed at: ${new Date().toUTCString()}*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.name,
              body: body
            });