# Cost rule: Actions minutes are capped, so a PR pays only for what it can break.
# Docs-only changes and draft PRs skip every job, non-release runs (PRs into dev or
# feat/**, pushes to dev) pay setup once in one job and lint and test changed files
# only (changed-file jest runs on pull requests only, never on pushes to dev), and
# the cold tsc, full sharded suite and build run on PRs into prod and on pushes to
# staging or prod. New jobs must state which of these they follow.

# CodeRabbit reviews dev-target PRs once when ready; other bases and later rounds
# are manual. Triage findings by risk: blocking defects must be fixed before merge.

name: CI

# The default token can read the repository; nothing here needs to write to it.
# A job that needs more must say so in its own `permissions:` block.
permissions:
  contents: read

# A newer dev tip contains the older one, so superseded runs on PRs and on dev are
# cancelled; staging/prod pushes deploy and always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/dev' }}

on:
  # A direct push to a release branch deploys without a PR, so the same checks
  # run on push too.
  push:
    branches: [dev, staging, prod]
    # Docs-only changes skip CI; the secrets manifest is re-included because the
    # workflow hygiene guard reads it.
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "!.claude/**"
      - "!prompts/**"
      - "docs/enterprise/50-operations/07-required-secrets.md"
  pull_request:
    # `feat/**` is here because a sub-PR whose base is a feature branch would
    # otherwise run no checks until the integration PR.
    branches: [dev, staging, prod, "feat/**"]
    # ready_for_review: draft PRs are skipped, so marking one ready starts its run.
    types: [opened, synchronize, reopened, ready_for_review]
    # Docs-only changes skip CI; the secrets manifest is re-included because the
    # workflow hygiene guard reads it.
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "!.claude/**"
      - "!prompts/**"
      - "docs/enterprise/50-operations/07-required-secrets.md"
  workflow_dispatch:

# `release` = PRs into prod, pushes to staging or prod, manual runs. Every other
# run (PRs into dev, staging or feat/**, pushes to dev) is a changed-files run.
jobs:
  checks:
    name: Lint, TypeScript & guards
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RELEASE: ${{ github.event_name == 'workflow_dispatch' || github.base_ref == 'prod' || github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/staging' }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select changed files
        # Writes NUL-delimited lists (never newline text, so any filename survives):
        # /tmp/changed.z = existing changed files for the linters, /tmp/all.z = every
        # touched path (deletions, type changes, both sides of renames) for the gates.
        # Outputs `full` (config changed or no base: also lint everything) and `db`
        # (run the database sidecar guard). Release runs always do both.
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          : > /tmp/changed.z
          : > /tmp/all.z
          full=true
          if [ "$RELEASE" != "true" ]; then
            if [ "$EVENT" = pull_request ]; then base="origin/${BASE_REF}"; else base="$BEFORE"; fi
            if [ -n "$base" ] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
              git diff -z --name-only --diff-filter=ACMR "${base}...HEAD" -- > /tmp/changed.z
              git diff -z --name-only --no-renames "${base}...HEAD" -- > /tmp/all.z
              full=false
              # Config and lockfile changes alter what every file is checked against.
              if grep -zEq '^(eslint\.config|\.prettier|package(-lock)?\.json$)' /tmp/all.z; then full=true; fi
            fi
          fi
          db=true
          if [ "$full" = false ] && ! grep -zEq '^(prisma/|scripts/db/|scripts/ci/(check-db|check-migrations|migrate-gate)|jest\.db\.config|__tests__/db/|\.github/workflows/ci\.yaml$)' /tmp/all.z; then db=false; fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "db=$db" >> "$GITHUB_OUTPUT"

      - name: Start Postgres 17.6
        # Pinned to Supabase's minor; UTC like Supabase, because naive timestamp columns
        # make seat counts depend on the session timezone. Not a `services:` container:
        # those pull from one registry, and ECR Public's anonymous per-IP quota fails the
        # job ("toomanyrequests"). Same official image, tried from ECR, then Google's
        # Docker Hub mirror, then Docker Hub. Started before the install so it initialises meanwhile.
        if: steps.changed.outputs.db == 'true'
        run: |
          for img in public.ecr.aws/docker/library/postgres:17.6 \
                     mirror.gcr.io/library/postgres:17.6 \
                     docker.io/library/postgres:17.6; do
            if docker pull -q "$img"; then IMG="$img"; break; fi
            echo "::warning::postgres pull failed from $img, trying next mirror"
          done
          if [ -z "${IMG:-}" ]; then
            echo "::error::postgres:17.6 unavailable from every mirror"
            exit 1
          fi
          docker run -d --name pg -p 5432:5432 \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=ci "$IMG" -c timezone=UTC

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Restore Prisma engines
        uses: actions/cache@v6
        with:
          path: ~/.cache/prisma
          key: prisma-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Wait for Postgres
        # Over TCP on purpose: during first-boot init the entrypoint runs a
        # socket-only temporary server, so a socket check can pass too early.
        if: steps.changed.outputs.db == 'true'
        run: |
          for _ in $(seq 1 30); do
            docker exec pg pg_isready -h 127.0.0.1 -U postgres -d ci && exit 0
            sleep 2
          done
          docker logs pg
          exit 1

      - name: Build the database from the migration history
        # Only ever the throwaway container above, and before `.env` exists, so these
        # are the only URLs prisma.config.ts and lib/prisma.ts see. Supabase's Data API
        # roles are created first so the REVOKE migration runs its real branch here.
        if: steps.changed.outputs.db == 'true'
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/ci
        run: |
          docker exec pg psql -v ON_ERROR_STOP=1 -U postgres -d ci -c "
            DO \$\$ BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon NOLOGIN; END IF;
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN CREATE ROLE service_role NOLOGIN BYPASSRLS; END IF;
            END \$\$;" -c "CREATE DATABASE shadow"
          node_modules/.bin/prisma migrate deploy

      - name: Migration history lint
        # Linear folders, no edited applied migration, BEGIN/COMMIT wrapping, and a
        # history that produces exactly prisma/schema.prisma (diffed on the shadow database).
        if: steps.changed.outputs.db == 'true'
        env:
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shadow
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=""
          if [ "$EVENT" = pull_request ]; then base="origin/${BASE_REF}"
          elif [ -n "$BEFORE" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then base="$BEFORE"; fi
          node_modules/.bin/tsx scripts/ci/check-migrations.ts $base

      - name: Database sidecar guard
        if: steps.changed.outputs.db == 'true'
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/ci
        run: node_modules/.bin/tsx scripts/ci/check-db-sidecars.ts

      - name: Support transaction races on disposable Postgres
        # __tests__/db/guard.ts refuses any DATABASE_URL other than this container.
        if: steps.changed.outputs.db == 'true'
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/ci
        run: node_modules/.bin/jest -c jest.db.config.ts

      - name: Load environment
        # The production environment is materialised here, so only a branch
        # inside this repository may run this job: a pull request from a fork
        # would otherwise run untrusted test code with the production
        # credentials in its environment. The job condition carries the same
        # same-repo guard.
        run: echo "${{ secrets.ENV_FILE }}" | base64 -d > .env

      - name: Shell syntax + shellcheck
        # scripts/ci/notify-ops-failure.sh is the alert path for every money cron;
        # a script that does not parse is a dead sink nobody sees.
        run: |
          for f in scripts/ci/*.sh; do bash -n "$f"; done
          shellcheck scripts/ci/*.sh

      - name: Prettier Check
        id: prettier
        run: |
          if [ "${{ steps.changed.outputs.full }}" = "true" ]; then
            npm run format:check 2>&1 | tee /tmp/prettier.txt; exit "${PIPESTATUS[0]}"
          else
            xargs -0 -r node_modules/.bin/prettier --check --ignore-unknown -- < /tmp/changed.z 2>&1 | tee /tmp/prettier.txt; exit "${PIPESTATUS[0]}"
          fi
        continue-on-error: true

      - name: ESLint Check
        # Non-release runs fail on any warning in a changed file; a config change
        # adds a full pass whose warnings in untouched files stay advisory.
        # Release runs lint everything with warnings advisory.
        id: eslint
        run: |
          rc=0
          if [ "$RELEASE" != "true" ]; then
            grep -zE '\.(js|jsx|mjs|cjs|ts|tsx|mts|cts)$' /tmp/changed.z > /tmp/changed-src.z || true
            xargs -0 -r node_modules/.bin/eslint --max-warnings=0 --no-warn-ignored --format stylish -- < /tmp/changed-src.z 2>&1 | tee /tmp/eslint.txt
            rc=${PIPESTATUS[0]}
          fi
          if [ "${{ steps.changed.outputs.full }}" = "true" ]; then
            node_modules/.bin/eslint . --format stylish 2>&1 | tee -a /tmp/eslint.txt
            [ "${PIPESTATUS[0]}" -eq 0 ] || rc=1
          fi
          exit "$rc"

      - name: Lint Summary
        if: always()
        run: |
          {
            echo "## Lint Results"
            echo ""

            if [ "${{ steps.prettier.outcome }}" = "failure" ]; then
              echo "### ❌ Prettier — formatting issues found"
              echo '```'
              cat /tmp/prettier.txt | head -50
              echo '```'
            else
              echo "### ✅ Prettier — no formatting issues"
            fi

            echo ""

            if [ "${{ steps.eslint.outcome }}" = "failure" ]; then
              echo "### ⚠️ ESLint — errors found"
              echo '```'
              cat /tmp/eslint.txt | head -100
              echo '```'
            else
              echo "### ✅ ESLint — no issues"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Supply-chain security audit
        # Fail CI on a high or critical production advisory; the script's dated allowlist holds the only exceptions.
        # npm audit exits non-zero on any finding; the gate decides from its JSON.
        run: "{ npm audit --omit=dev --json || true; } | node_modules/.bin/tsx scripts/ci/check-npm-audit.ts"

      - name: Runner resources
        # Private-repo ubuntu-latest is ~2 vCPU / ~7 GB. Printed so a future
        # OOM can be read against the real ceiling instead of guessed.
        run: nproc && free -m

      - name: Restore tsc incremental state
        # Release runs stay cold: a warm tsc can mask errors.
        if: env.RELEASE != 'true'
        uses: actions/cache@v6
        with:
          path: tsconfig.tsbuildinfo
          key: tsc-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            tsc-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: TypeScript Check
        # A cold tsc (lockfile change, cache miss) exceeds 4 GB and exits 134; 6 GB
        # matches release-checks and leaves the OS headroom on a ~7 GB VM.
        run: npx tsc --noEmit
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Money-column guard
        # No money column may be declared Int (int4 overflows at ₹2.14cr).
        # BigInt columns must also be in the lib/prisma.ts boundary map; that
        # half is enforced by the extension drift test.
        run: npx --yes tsx@4.23.1 scripts/ci/check-money-columns.ts

      - name: Auth schema guard
        # BetterAuth 1.7 fails every /api/auth/* request when the Prisma
        # schema lacks a table or column it writes. Catch that here instead.
        run: npx --yes tsx@4.23.1 scripts/ci/check-auth-schema.ts

      - name: Workflow hygiene guard
        # A `${{ secrets.X }}` that doesn't exist interpolates an empty string
        # and the job still reports success. Static only: no network, no
        # database. tsx is pinned at the call site so the registry cannot
        # change what runs on the execution path of every money cron.
        run: npx --yes tsx@4.23.1 scripts/ci/check-workflow-hygiene.ts

      - name: Docs drift guard (warn-only)
        # Cited repo paths, relative links and start-here line numbers in docs/
        # and .claude/skills/. Warn-only until the existing docs are clean.
        continue-on-error: true
        run: node_modules/.bin/tsx scripts/ci/check-docs-drift.ts

      - name: Unit Tests (changed since base)
        # Release runs use the sharded full suite below. Inputs outside Jest's
        # import graph (schema, config, lockfile) run the full suite here.
        if: env.RELEASE != 'true' && github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -Eq '^(prisma/|jest\.|package(-lock)?\.json$|tsconfig)'; then
            npx jest --coverage=false
          else
            npx jest --changedSince="origin/${BASE_REF}" --passWithNoTests --coverage=false
          fi

  # Release runs only (PRs into prod, pushes to staging or prod): the full suite, sharded.
  unit-tests:
    name: Unit tests (${{ matrix.shard }})
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false)) &&
      (github.event_name == 'workflow_dispatch' || github.base_ref == 'prod' || github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    # No redis service: nothing in the app speaks TCP redis (it uses Upstash
    # over REST, and tests mock it).
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Restore Prisma engines
        uses: actions/cache@v6
        with:
          path: ~/.cache/prisma
          key: prisma-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Load environment
        # Same-repo only: see the note on the `checks` job.
        run: echo "${{ secrets.ENV_FILE }}" | base64 -d > .env

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Unit Tests
        run: npx jest --shard=${{ matrix.shard }} --coverage=false

  # Release runs only; non-release PRs are built by the Netlify deploy preview.
  build:
    name: Build
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false)) &&
      (github.event_name == 'workflow_dispatch' || github.base_ref == 'prod' || github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Load environment
        # Same-repo only: see the note on the `checks` job.
        run: echo "${{ secrets.ENV_FILE }}" | base64 -d > .env

      - name: Runner resources
        run: nproc && free -m

      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.js', '**/*.mjs', '!node_modules/**', '!.next/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        # Raise the V8 heap so `next build` does not flaky-OOM on the runner; a
        # 6144 heap left the OS nothing on a ~7 GB VM. CI_LEAN_BUILD
        # (next.config.mjs) drops the type-check phase (the `checks` job covers
        # it) plus Sentry source maps / release, so the build fits in 5 GB.
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=5120
          CI_LEAN_BUILD: "true"

  # The one required check: passes only when every job that applies to this run passed.
  # Skipped (reported as passing) where its inputs skip for Dependabot, except on release runs, which fail closed.
  test-and-build:
    name: TypeScript, Tests & Build
    needs: [checks, unit-tests, build]
    if: >-
      always() &&
      (github.actor != 'dependabot[bot]' || github.event_name == 'workflow_dispatch' || github.base_ref == 'prod' || github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/staging') &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All applicable jobs passed
        run: |
          test "${{ needs.checks.result }}" = success
          if [ "${{ github.event_name == 'workflow_dispatch' || github.base_ref == 'prod' || github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/staging' }}" = true ]; then
            test "${{ needs.unit-tests.result }}" = success
            test "${{ needs.build.result }}" = success
          else
            test "${{ needs.unit-tests.result }}" = skipped
            test "${{ needs.build.result }}" = skipped
          fi
