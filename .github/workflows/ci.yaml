# Bot review rounds: two, then stop.
#
# CodeRabbit runs on the ASSERTIVE profile and re-reviews on every push, so each
# round of fixes produces a fresh round of comments on the diff those fixes
# created. Round 1 clears the substantive findings; round 2 clears whatever
# round 1 provoked. After that, answer remaining comments in the thread and
# merge — do not push again just to silence the bot.
#
# The drawback, stated so nobody has to rediscover it: stopping at two means a
# genuine finding raised in round 3 gets a reply rather than a fix in this PR.
# That is the accepted cost. The alternative — looping until the bot is silent —
# does not converge on an ASSERTIVE profile: it reliably finds something on any
# new diff, and past round 2 that something is overwhelmingly refactor-for-its-
# own-sake (cognitive-complexity thresholds, helper extraction). Each extra push
# also resets approvals and burns a full CI cycle, so the churn is not free.
#
# Anything real that surfaces late belongs in a follow-up issue, where it keeps
# its own context, instead of growing this PR's diff past what a human will read.

name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  # A direct push to a release branch deploys without a PR, so the same checks
  # run on push too.
  push:
    branches: [dev, staging, prod]
  pull_request:
    # `feat/**` is here because a stacked train is the normal shape for large
    # work in this repo and, without it, a sub-PR whose base is a feature branch
    # ran NO checks at all — no tsc, no drift guard, no sidecar assertion — until
    # the integration PR. The gap was found the hard way (#1268's stack).
    branches: [dev, staging, prod, "feat/**"]
    # labeled/unlabeled: the `db-reset` label decides which database the guards
    # and the build run against (#1554), so toggling it must re-run the job.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Shell syntax + shellcheck
        # #1757 — scripts/ci/notify-ops-failure.sh is the alert path for every
        # money cron; a script that does not parse is a dead sink nobody sees.
        run: |
          for f in scripts/ci/*.sh; do bash -n "$f"; done
          shellcheck scripts/ci/*.sh

      - name: Prettier Check
        id: prettier
        run: npm run format:check 2>&1 | tee /tmp/prettier.txt; exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: ESLint Check
        id: eslint
        run: npx eslint . --format stylish 2>&1 | tee /tmp/eslint.txt; exit ${PIPESTATUS[0]}

      - name: Lint Summary
        if: always()
        run: |
          {
            echo "## Lint Results"
            echo ""

            if [ "${{ steps.prettier.outcome }}" = "failure" ]; then
              echo "### ❌ Prettier — formatting issues found"
              echo '```'
              cat /tmp/prettier.txt | head -50
              echo '```'
            else
              echo "### ✅ Prettier — no formatting issues"
            fi

            echo ""

            if [ "${{ steps.eslint.outcome }}" = "failure" ]; then
              echo "### ⚠️ ESLint — errors found (warnings are advisory)"
              echo '```'
              cat /tmp/eslint.txt | head -100
              echo '```'
            else
              echo "### ✅ ESLint — no issues"
            fi
          } >> $GITHUB_STEP_SUMMARY

  typecheck:
    name: TypeScript & guards
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Supply-chain security audit
        # #1885 — fail CI when any production dependency has a high or critical
        # advisory so vulnerable transitive packages cannot ship to prod.
        run: npm audit --omit=dev --audit-level=high

      - name: Load environment
        run: echo "${{ secrets.ENV_FILE }}" | base64 -d > .env

      - name: Point the database at the reset rehearsal (label db-reset)
        # #1554 — a PR that renames tables cannot be checked against the live
        # database until the reset. With the `db-reset` label the sidecar/drift
        # guards and the build run against the rehearsal project instead of
        # being skipped; remove the label (and the two secrets) after the cutover.
        if: contains(github.event.pull_request.labels.*.name, 'db-reset')
        run: |
          test -n "${{ secrets.REHEARSAL_DATABASE_URL }}" || { echo "db-reset label set but REHEARSAL_DATABASE_URL is missing"; exit 1; }
          sed -i -E 's#^DATABASE_URL=.*#DATABASE_URL="${{ secrets.REHEARSAL_DATABASE_URL }}"#; s#^DIRECT_URL=.*#DIRECT_URL="${{ secrets.REHEARSAL_DIRECT_URL }}"#' .env
          grep -cE '^(DATABASE_URL|DIRECT_URL)=' .env

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Money-column guard
        # #780 — no money column may be declared Int (int4 overflows at
        # ₹2.14cr). BigInt columns must also be in the lib/prisma.ts
        # boundary map; that half is enforced by the extension drift test.
        run: npx --yes tsx@4.23.1 scripts/ci/check-money-columns.ts

      - name: Auth schema guard
        # BetterAuth 1.7 fails every /api/auth/* request when the Prisma
        # schema lacks a table or column it writes. Catch that here instead.
        run: npx --yes tsx@4.23.1 scripts/ci/check-auth-schema.ts

      - name: Workflow hygiene guard
        # A `${{ secrets.X }}` that doesn't exist interpolates an empty string
        # and the job still reports success — that is how #677 PM-1 came back
        # after being fixed in code. Also catches recurring cron start
        # collisions. Static only: no network, no database.
        #
        # tsx is pinned at the call site (`tsx@4.23.1`). It used to be a bare
        # `npx tsx`, which resolves whatever the registry currently serves —
        # an unversioned package on the execution path of every money cron.
        # Adding it as a devDependency would be better still, but it pulls in
        # esbuild and that broke the Netlify build; see the PR discussion.
        run: npx --yes tsx@4.23.1 scripts/ci/check-workflow-hygiene.ts

  unit-tests:
    name: Unit tests (${{ matrix.shard }}/4)
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Load environment
        run: echo "${{ secrets.ENV_FILE }}" | base64 -d > .env

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Unit Tests
        # Each shard sees a quarter of the suite, so the global branch-coverage
        # gate in jest.config.ts cannot be evaluated per shard and is cleared here.
        run: npx jest --shard=${{ matrix.shard }}/4 --coverageThreshold='{}'

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage
          if-no-files-found: ignore

  build:
    name: Build
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Load environment
        run: echo "${{ secrets.ENV_FILE }}" | base64 -d > .env

      - name: Point the database at the reset rehearsal (label db-reset)
        # #1554 — a PR that renames tables cannot be checked against the live
        # database until the reset. With the `db-reset` label the sidecar/drift
        # guards and the build run against the rehearsal project instead of
        # being skipped; remove the label (and the two secrets) after the cutover.
        if: contains(github.event.pull_request.labels.*.name, 'db-reset')
        run: |
          test -n "${{ secrets.REHEARSAL_DATABASE_URL }}" || { echo "db-reset label set but REHEARSAL_DATABASE_URL is missing"; exit 1; }
          sed -i -E 's#^DATABASE_URL=.*#DATABASE_URL="${{ secrets.REHEARSAL_DATABASE_URL }}"#; s#^DIRECT_URL=.*#DIRECT_URL="${{ secrets.REHEARSAL_DIRECT_URL }}"#' .env
          grep -cE '^(DATABASE_URL|DIRECT_URL)=' .env

      - name: Build
        # Raise the V8 heap so `next build` (+ Sentry source-map generation) does
        # not flaky-OOM on the runner — mirrors netlify.toml's NODE_OPTIONS. The
        # default heap sits right at the build's peak, so it intermittently exits
        # 134 (heap out of memory) on otherwise-identical builds.
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  test-and-build:
    name: TypeScript, Tests & Build
    needs: [typecheck, unit-tests, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All of typecheck, unit tests and build passed
        run: |
          test "${{ needs.typecheck.result }}" = success
          test "${{ needs.unit-tests.result }}" = success
          test "${{ needs.build.result }}" = success

  # Hermetic: applies this branch's schema + SQL sidecars to a throwaway Postgres
  # and asserts them, so red means the branch is broken, never the shared DB.
  # Live-DB drift is checked off the PR path by db-live-drift.yml.
  db-guards:
    name: Database sidecar + drift guard
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        # Supabase runs 17; the sidecars need 15+ (NULLS NOT DISTINCT) and btree_gist.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # No .env exists here, so these are the only URLs prisma.config.ts and lib/prisma.ts see.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/ci

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Push schema + sidecars
        # `db push` alone drops the ledger trigger and every CHECK; sidecars restore them.
        run: |
          node_modules/.bin/prisma db push
          npm run db:sidecars

      - name: Database sidecar + drift guard
        run: |
          node_modules/.bin/tsx scripts/ci/check-db-sidecars.ts
          node_modules/.bin/tsx scripts/ci/check-db-drift.ts
