# Cost rule: Actions minutes are capped, so a PR pays only for what it can break.
# Docs-only changes skip every job (paths filter), PRs into non-release branches
# run jest on changed files only, and the full sharded suite plus the build run
# on pushes and on PRs into prod. New jobs must state which of these they follow.

# Bot review rounds: two, then stop.
#
# CodeRabbit runs on the ASSERTIVE profile and re-reviews on every push, so each
# round of fixes produces a fresh round of comments on the diff those fixes
# created. Round 1 clears the substantive findings; round 2 clears whatever
# round 1 provoked. After that, answer remaining comments in the thread and
# merge — do not push again just to silence the bot.
#
# The drawback, stated so nobody has to rediscover it: stopping at two means a
# genuine finding raised in round 3 gets a reply rather than a fix in this PR.
# That is the accepted cost. The alternative — looping until the bot is silent —
# does not converge on an ASSERTIVE profile: it reliably finds something on any
# new diff, and past round 2 that something is overwhelmingly refactor-for-its-
# own-sake (cognitive-complexity thresholds, helper extraction). Each extra push
# also resets approvals and burns a full CI cycle, so the churn is not free.
#
# Anything real that surfaces late belongs in a follow-up issue, where it keeps
# its own context, instead of growing this PR's diff past what a human will read.

name: CI

# A newer dev tip contains the older one, so superseded runs on PRs and on dev are
# cancelled; staging/prod pushes deploy and always finish. A label other than
# `db-reset` gets its own group and skips every job, so it never cancels a run in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ ((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'db-reset' && github.run_id) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/dev' }}

on:
  # A direct push to a release branch deploys without a PR, so the same checks
  # run on push too.
  push:
    branches: [dev, staging, prod]
    # Docs-only changes skip CI; the secrets manifest is re-included because the
    # workflow hygiene guard reads it.
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "!.claude/**"
      - "!prompts/**"
      - "docs/enterprise/50-operations/07-required-secrets.md"
  pull_request:
    # `feat/**` is here because a stacked train is the normal shape for large
    # work in this repo and, without it, a sub-PR whose base is a feature branch
    # ran NO checks at all — no tsc, no drift guard, no sidecar assertion — until
    # the integration PR. The gap was found the hard way (#1268's stack).
    branches: [dev, staging, prod, "feat/**"]
    # labeled/unlabeled: the `db-reset` label decides which database the guards
    # and the build run against (#1554), so toggling it must re-run the job.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    # Docs-only changes skip CI; the secrets manifest is re-included because the
    # workflow hygiene guard reads it.
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "!.claude/**"
      - "!prompts/**"
      - "docs/enterprise/50-operations/07-required-secrets.md"
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    timeout-minutes: 15
    if: github.actor != 'dependabot[bot]' && ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'db-reset')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Shell syntax + shellcheck
        # #1757 — scripts/ci/notify-ops-failure.sh is the alert path for every
        # money cron; a script that does not parse is a dead sink nobody sees.
        run: |
          for f in scripts/ci/*.sh; do bash -n "$f"; done
          shellcheck scripts/ci/*.sh

      - name: Prettier Check
        id: prettier
        run: npm run format:check 2>&1 | tee /tmp/prettier.txt; exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: ESLint Check
        id: eslint
        run: npx eslint . --format stylish 2>&1 | tee /tmp/eslint.txt; exit ${PIPESTATUS[0]}

      - name: Lint Summary
        if: always()
        run: |
          {
            echo "## Lint Results"
            echo ""

            if [ "${{ steps.prettier.outcome }}" = "failure" ]; then
              echo "### ❌ Prettier — formatting issues found"
              echo '```'
              cat /tmp/prettier.txt | head -50
              echo '```'
            else
              echo "### ✅ Prettier — no formatting issues"
            fi

            echo ""

            if [ "${{ steps.eslint.outcome }}" = "failure" ]; then
              echo "### ⚠️ ESLint — errors found (warnings are advisory)"
              echo '```'
              cat /tmp/eslint.txt | head -100
              echo '```'
            else
              echo "### ✅ ESLint — no issues"
            fi
          } >> $GITHUB_STEP_SUMMARY

  typecheck:
    name: TypeScript & guards
    if: github.actor != 'dependabot[bot]' && ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'db-reset')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Supply-chain security audit
        # #1885 — fail CI when any production dependency has a high or critical
        # advisory so vulnerable transitive packages cannot ship to prod.
        run: npm audit --omit=dev --audit-level=high

      - name: Load environment
        run: echo "${{ secrets.ENV_FILE }}" | base64 -d > .env

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Runner resources
        # Private-repo ubuntu-latest is ~2 vCPU / ~7 GB. Printed so a future
        # OOM can be read against the real ceiling instead of guessed.
        run: nproc && free -m

      - name: TypeScript Check
        # tsc's peak for this project sits at Node's RAM-derived default heap
        # (~2 GB on this runner), so without a flag it exits 134. 4 GB leaves
        # the OS headroom on a ~7 GB VM; tsc is the only thing running here.
        run: npx tsc --noEmit
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Money-column guard
        # #780 — no money column may be declared Int (int4 overflows at
        # ₹2.14cr). BigInt columns must also be in the lib/prisma.ts
        # boundary map; that half is enforced by the extension drift test.
        run: npx --yes tsx@4.23.1 scripts/ci/check-money-columns.ts

      - name: Auth schema guard
        # BetterAuth 1.7 fails every /api/auth/* request when the Prisma
        # schema lacks a table or column it writes. Catch that here instead.
        run: npx --yes tsx@4.23.1 scripts/ci/check-auth-schema.ts

      - name: Workflow hygiene guard
        # A `${{ secrets.X }}` that doesn't exist interpolates an empty string
        # and the job still reports success — that is how #677 PM-1 came back
        # after being fixed in code. Static only: no network, no database.
        #
        # tsx is pinned at the call site (`tsx@4.23.1`). It used to be a bare
        # `npx tsx`, which resolves whatever the registry currently serves —
        # an unversioned package on the execution path of every money cron.
        # Adding it as a devDependency would be better still, but it pulls in
        # esbuild and that broke the Netlify build; see the PR discussion.
        run: npx --yes tsx@4.23.1 scripts/ci/check-workflow-hygiene.ts

      - name: Docs drift guard (warn-only)
        # Cited repo paths, relative links and start-here line numbers in docs/
        # and .claude/skills/. Warn-only until the existing docs are clean.
        continue-on-error: true
        run: node_modules/.bin/tsx scripts/ci/check-docs-drift.ts

      - name: Schema map guard
        # docs/prisma/00-schema-map.md is generated from prisma/schema.prisma.
        # A schema change that forgot its diagram fails here instead of in a
        # reader's head. Static only: no network, no database.
        run: npx --yes tsx@4.23.1 scripts/ci/check-schema-map.ts

  # Pull requests into non-release branches: only tests related to the diff.
  unit-tests-changed:
    name: Unit tests (changed files)
    if: github.actor != 'dependabot[bot]' && github.event_name == 'pull_request' && github.base_ref != 'prod' && ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'db-reset')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Load environment
        run: echo "${{ secrets.ENV_FILE }}" | base64 -d > .env

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Unit Tests (changed since base)
        env:
          BASE_REF: ${{ github.base_ref }}
        # Inputs outside Jest's import graph (schema, config, lockfile) run the full suite.
        run: |
          if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -Eq '^(prisma/|jest\.|package(-lock)?\.json$|tsconfig)'; then
            npx jest --coverage=false
          else
            npx jest --changedSince="origin/${BASE_REF}" --passWithNoTests --coverage=false
          fi

  # Pushes and pull requests into prod: the full suite, sharded.
  unit-tests:
    name: Unit tests (${{ matrix.shard }})
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.base_ref == 'prod') && ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'db-reset')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    # No redis service: nothing in the app speaks TCP redis (it uses Upstash
    # over REST, and tests mock it). The old container was dead weight whose
    # anonymous ECR Public pull failed jobs with "toomanyrequests: Data limit
    # exceeded" before a single test ran.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Load environment
        run: echo "${{ secrets.ENV_FILE }}" | base64 -d > .env

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Unit Tests
        run: npx jest --shard=${{ matrix.shard }} --coverage=false

  build:
    name: Build
    # PRs are built by the Netlify deploy preview (the build gate); CI builds pushes and release PRs.
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.base_ref == 'prod') && ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'db-reset') && ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'db-reset')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # No redis service — see the note on unit-tests.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Load environment
        run: echo "${{ secrets.ENV_FILE }}" | base64 -d > .env

      - name: Runner resources
        run: nproc && free -m

      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.js', '**/*.mjs', '!node_modules/**', '!.next/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        # Raise the V8 heap so `next build` does not flaky-OOM on the runner. It
        # was 6144, which on a ~7 GB VM left the OS nothing: the runner itself
        # was killed ("received a shutdown signal") at "Linting and checking
        # validity of types". CI_LEAN_BUILD (next.config.mjs) drops that phase —
        # the TypeScript & guards and Lint jobs already cover it — plus Sentry
        # source maps / release, so the build fits in 5 GB with room to spare.
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=5120
          CI_LEAN_BUILD: "true"

  test-and-build:
    name: TypeScript, Tests & Build
    needs: [typecheck, unit-tests, unit-tests-changed, build]
    if: always() && ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'db-reset')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All of typecheck, unit tests and build passed
        run: |
          test "${{ needs.typecheck.result }}" = success
          full="${{ needs.unit-tests.result }}"; changed="${{ needs.unit-tests-changed.result }}"
          { test "$full" = success && test "$changed" = skipped; } \
            || { test "$changed" = success && test "$full" = skipped; }
          test "${{ needs.build.result }}" = success \
            || { test "${{ github.event_name }}" = pull_request \
              && test "${{ github.base_ref }}" != prod \
              && test "${{ needs.build.result }}" = skipped; }

  # Hermetic: applies this branch's schema + SQL sidecars to a throwaway Postgres
  # and asserts them, so red means the branch is broken, never the shared DB.
  db-guards:
    name: Database sidecar guard
    if: ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'db-reset')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    # No .env exists here, so these are the only URLs prisma.config.ts and lib/prisma.ts see.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/ci

    steps:
      # Supabase runs 17; the sidecars need 15+ (NULLS NOT DISTINCT) and btree_gist.
      # Not a `services:` container: those pull from exactly one registry, and
      # ECR Public's anonymous per-IP quota on shared runners fails the job
      # outright ("toomanyrequests: Data limit exceeded"). Same official image,
      # tried from ECR, then Google's Docker Hub mirror, then Docker Hub.
      # Started first so it initialises while dependencies install.
      - name: Start Postgres 17
        run: |
          for img in public.ecr.aws/docker/library/postgres:17 \
                     mirror.gcr.io/library/postgres:17 \
                     docker.io/library/postgres:17; do
            if docker pull -q "$img"; then IMG="$img"; break; fi
            echo "::warning::postgres pull failed from $img, trying next mirror"
          done
          if [ -z "${IMG:-}" ]; then
            echo "::error::postgres:17 unavailable from every mirror"
            exit 1
          fi
          docker run -d --name pg -p 5432:5432 \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=ci "$IMG"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Wait for Postgres
        # Over TCP on purpose: during first-boot init the entrypoint runs a
        # socket-only temporary server, so a socket check can pass too early.
        run: |
          for _ in $(seq 1 30); do
            docker exec pg pg_isready -h 127.0.0.1 -U postgres -d ci && exit 0
            sleep 2
          done
          docker logs pg
          exit 1

      - name: Push schema + sidecars
        # Only ever the throwaway container above; `db push` alone drops the ledger trigger and every CHECK.
        run: |
          node_modules/.bin/prisma db push
          npm run db:sidecars

      - name: Database sidecar guard
        run: node_modules/.bin/tsx scripts/ci/check-db-sidecars.ts
