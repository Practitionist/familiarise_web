name: CI

on:
  pull_request:
    branches: [dev, staging, prod]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prettier Check
        id: prettier
        run: npm run format:check 2>&1 | tee /tmp/prettier.txt; exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: ESLint Check
        id: eslint
        run: npx eslint . --format stylish 2>&1 | tee /tmp/eslint.txt; exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: Lint Summary
        if: always()
        run: |
          {
            echo "## Lint Results"
            echo ""

            if [ "${{ steps.prettier.outcome }}" = "failure" ]; then
              echo "### ❌ Prettier — formatting issues found"
              echo '```'
              cat /tmp/prettier.txt | head -50
              echo '```'
            else
              echo "### ✅ Prettier — no formatting issues"
            fi

            echo ""

            if [ "${{ steps.eslint.outcome }}" = "failure" ]; then
              echo "### ⚠️ ESLint — errors/warnings found (non-blocking)"
              echo '```'
              cat /tmp/eslint.txt | head -100
              echo '```'
            else
              echo "### ✅ ESLint — no issues"
            fi
          } >> $GITHUB_STEP_SUMMARY

  test-and-build:
    name: TypeScript, Tests & Build
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Load environment
        run: echo "${{ secrets.ENV_FILE }}" | base64 -d > .env

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Verify SSO invariants
        # Cheap static guard against regressions in the SSO audit fixes
        # (PR #655 / issue #672). See scripts/verify-sso-invariants.sh
        # for per-check rationale.
        run: bash scripts/verify-sso-invariants.sh

      - name: Money-column guard
        # #780 — no money column may be declared Int (int4 overflows at
        # ₹2.14cr). BigInt columns must also be in the lib/prisma.ts
        # boundary map; that half is enforced by the extension drift test.
        run: npx tsx scripts/ci/check-money-columns.ts

      - name: Enum drift guard
        # Every enum value in the DATABASE must be declared in schema.prisma.
        # Prisma throws on any row holding an undeclared value, wherever it is
        # read — which is rarely where the mistake was made. Removing
        # LEMON_SQUEEZY/XFLOW from PaymentGateway in 2026-07 without migrating
        # the 187 rows using them went unnoticed for 16 days, then surfaced as
        # a failing cleanup cron and a dead back-office payments dashboard.
        # Skips cleanly without DATABASE_URL, so forked PRs do not fail on a
        # check they cannot perform.
        # Plain node on `pg`, not `npx tsx`: tsx is not a dependency of this
        # repo, so `npx tsx` fetches an unpinned release from the registry and
        # runs it — with DATABASE_URL in scope here. Adding tsx to close that
        # broke the Netlify build (see #1041), so the guard drops the TS runner
        # instead. It only needs catalog SQL, and pg is already a dependency.
        run: node scripts/ci/check-enum-drift.mjs
        env:
          # Read-only catalog query. Without this the script skips, which would
          # make the guard look like coverage while checking nothing.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Unit Tests
        run: npm run test

      - name: Build
        # Raise the V8 heap so `next build` (+ Sentry source-map generation) does
        # not flaky-OOM on the runner — mirrors netlify.toml's NODE_OPTIONS. The
        # default heap sits right at the build's peak, so it intermittently exits
        # 134 (heap out of memory) on otherwise-identical builds.
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
