name: CI

on:
  pull_request:
    branches: [dev, staging, prod]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prettier Check
        run: npm run format:check
        continue-on-error: true

      - name: ESLint Check
        run: npx eslint .
        continue-on-error: true

  test-and-build:
    name: TypeScript, Tests & Build
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Load environment
        run: echo "${{ secrets.ENV_FILE }}" | base64 -d > .env

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Unit Tests
        run: npm run test -- --passWithNoTests

      - name: Build
        run: npm run build
