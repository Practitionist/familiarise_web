name: Reconcile Orphaned Meeting Sessions

on:
  schedule:
    # Every 30 minutes, offset off the busy :00/:15/:30/:45 slots.
    #
    # #1134 P1-1 — this job has existed since it was written and has NEVER run.
    # Its own docstring claimed "runs every 30 minutes via cleanup API route",
    # but no workflow invoked it and nothing called the route. It is the only
    # backstop for a session whose `call.session_ended` webhook never landed —
    # and since the webhook secret was missing in production, that was every
    # session. 1,663 MeetingSession rows, 0 with endedAt, 1,417 of them more
    # than an hour past their slot end.
    #
    # Downstream of an unreconciled session: SlotOfAppointment.completionStatus
    # never leaves SCHEDULED, so the appointment never completes.
    - cron: "13,43 * * * *"
  workflow_dispatch:

# Never overlap: the job claims rows with a cron lock, but a queued run is
# cheaper than two racing Stream lookups over the same 100-row batch.
concurrency:
  group: reconcile-orphaned-sessions
  cancel-in-progress: false

jobs:
  reconcile-orphaned-sessions:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # #1066 — jobs run as bare Node processes, so Sentry.init only sees what
      # the step env carries.
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN || secrets.SENTRY_DSN }}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      # Needed to ask Stream whether the call actually ended. Without them the
      # job still runs but falls back to the slot end time and records every
      # session as UNVERIFIED.
      NEXT_PUBLIC_STREAM_API_KEY: ${{ secrets.NEXT_PUBLIC_STREAM_API_KEY }}
      STREAM_API_KEY: ${{ secrets.STREAM_API_KEY }}
      STREAM_API_SECRET: ${{ secrets.STREAM_API_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run orphaned session reconciliation
        run: npx --yes tsx@4.23.1 jobs/meetings/reconcile-orphaned-sessions.ts

      - name: Notify on failure
        if: failure()
        env:
          SLACK_OPS_WEBHOOK_URL: ${{ secrets.SLACK_OPS_WEBHOOK_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: bash scripts/ci/notify-ops-failure.sh "reconcile-orphaned-sessions"
