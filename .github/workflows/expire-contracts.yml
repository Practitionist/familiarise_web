name: Expire Contracts

on:
  schedule:
    # 03:10 UTC = 08:40 IST. #709 — moved off the 03:00 4-way pile-up
    # (stream-recordings / expired-recordings / sso-cert) onto its own minute;
    # still after auto-renew-contracts (02:30) so renewals supersede first.
    - cron: "10 3 * * *"
  workflow_dispatch: # Allow manual triggering

jobs:
  expire-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # #476 cron locks load lib/redis at import — every job entry needs these
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run contract-expiry job
        run: npx tsx jobs/contracts/expire-contracts.ts

      - name: Notify on failure
        if: failure()
        env:
          SLACK_OPS_WEBHOOK_URL: ${{ secrets.SLACK_OPS_WEBHOOK_URL }}
        run: bash scripts/ci/notify-ops-failure.sh "expire-contracts"
