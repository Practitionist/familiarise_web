name: Cleanup Orphaned Org Credit Purchases

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch: # Allow manual triggering

jobs:
  cleanup-orphaned-org-credit-purchases:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Database connection (required for Prisma)
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run orphaned purchase cleanup
        run: npx tsx jobs/enterprise/cleanup-orphaned-org-credit-purchases.ts

      - name: Notify on failure
        if: failure()
        run: |
          echo "Orphaned org credit purchase cleanup failed"
          # Add notification logic here (Slack, email, etc.)
