version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    target-branch: "main"
    labels:
      - "dependencies"
      - "npm"
    versioning-strategy: "auto"
    allow:
      - dependency-type: "direct"
    ignore:
      - dependency-name: "@types/*"
        update-types: ["version-update:semver-patch"]
    commit-message:
      prefix: "chore"
      include: "scope"
    reviewers:
      - "kaustavghosh"
