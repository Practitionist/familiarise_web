version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    open-pull-requests-limit: 30
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Kolkata"
    target-branch: "dev"
    labels:
      - "dependencies"
      - "npm"
    versioning-strategy: "auto"
    allow:
      - dependency-type: "direct"
    ignore:
      - dependency-name: "@types/*"
        update-types: ["version-update:semver-patch"]
    commit-message:
      prefix: "chore"
      include: "scope"
    reviewers:
      - "kaustavghosh"
    # Group dependencies to reduce PR noise
    groups:
      # Frontend framework dependencies
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "major"
          - "minor"
          - "patch"
      # Next.js related dependencies
      next-js:
        patterns:
          - "next"
          - "@next/*"
          - "next-auth"
        update-types:
          - "minor"
          - "patch"
      # UI component libraries
      radix-ui:
        patterns:
          - "@radix-ui/*"
        update-types:
          - "minor"
          - "patch"
      # Database related dependencies
      prisma:
        patterns:
          - "@prisma/*"
          - "prisma"
        update-types:
          - "minor"
          - "patch"
      # Testing libraries
      testing-libs:
        patterns:
          - "@testing-library/*"
          - "jest*"
          - "cypress"
        update-types:
          - "minor"
          - "patch"
      # Internationalization
      next-intl:
        patterns:
          - "next-intl"
          - "use-intl"
        update-types:
          - "minor"
          - "patch"
      # Stream related dependencies
      stream-io:
        patterns:
          - "@stream-io/*"
          - "stream-chat*"
        update-types:
          - "minor"
          - "patch"
      # ESLint and code quality tools
      linting:
        patterns:
          - "eslint*"
          - "prettier"
          - "typescript-eslint"
        update-types:
          - "minor"
          - "patch"
      # Tailwind and styling
      styling:
        patterns:
          - "tailwind*"
          - "postcss*"
          - "autoprefixer"
        update-types:
          - "minor"
          - "patch"

  # Add GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "dev"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
