<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hero background: A, dot grid and spotlight (shipped)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #000;
        font-family: Sora, system-ui, sans-serif;
      }
      .hero {
        position: relative;
        min-height: 95vh;
        display: flex;
        align-items: center;
        overflow: hidden;
        background: #000;
      }
      .layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .content {
        position: relative;
        z-index: 10;
        max-width: 56rem;
        margin: 0 auto;
        padding: 5rem 1rem;
        text-align: center;
      }
      .badge {
        display: inline-flex;
        gap: 0.5rem;
        padding: 0.5rem 1rem;
        border-radius: 9999px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.05);
        color: #a1a1aa;
        font-size: 0.875rem;
        margin-bottom: 2rem;
      }
      h1 {
        color: #fff;
        font-weight: 700;
        font-size: clamp(2.5rem, 6vw, 4.5rem);
        line-height: 1.15;
        letter-spacing: -0.025em;
        margin: 0 0 1.5rem;
      }
      .silver {
        background: linear-gradient(
          90deg,
          #71717a,
          #a1a1aa,
          #d4d4d8,
          #a1a1aa,
          #71717a
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .muted {
        color: #a1a1aa;
      }
      p.sub {
        color: #a1a1aa;
        font-size: 1.2rem;
        line-height: 1.6;
        max-width: 42rem;
        margin: 0 auto 2.5rem;
      }
      .ctas {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        justify-content: center;
      }
      .btn {
        height: 3.5rem;
        padding: 0 2rem;
        border-radius: 0.75rem;
        display: inline-flex;
        align-items: center;
        font-weight: 500;
      }
      .primary {
        background: #fff;
        color: #000;
      }
      .secondary {
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <!-- Hero background option A, dot grid and spotlight (shipped). Same values as the option's pull request; open this file in a browser to view it. -->
    <section class="hero">
      <div
        class="layer"
        style="
          background-image: radial-gradient(
            rgba(255, 255, 255, 0.22) 1px,
            transparent 1.5px
          );
          background-size: 24px 24px;
          mask-image: radial-gradient(
            ellipse 75% 65% at 50% 40%,
            #000 35%,
            transparent 80%
          );
          -webkit-mask-image: radial-gradient(
            ellipse 75% 65% at 50% 40%,
            #000 35%,
            transparent 80%
          );
        "
      ></div>
      <div
        class="layer"
        style="
          background: radial-gradient(
            ellipse 55% 50% at 50% 0%,
            rgba(255, 255, 255, 0.16),
            transparent 70%
          );
        "
      ></div>
      <div class="content">
        <div class="badge">
          &#10022; Every expert is vetted before they take a booking
        </div>
        <h1>
          Learn live from <span class="silver">people who do the work</span
          ><br /><span class="muted">in your field</span>
        </h1>
        <p class="sub">
          Join live classes and webinars, or book tutoring and private sessions
          with working professionals. Book, pay and learn in one place.
        </p>
        <div class="ctas">
          <span class="btn primary">Find Your Expert &rarr;</span
          ><span class="btn secondary">Become an Expert &rarr;</span>
        </div>
      </div>
    </section>
  </body>
</html>
