[build]
  # Build command for production
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Node version
  NODE_VERSION = "22"
  # Heap headroom for the webpack build. Lint + tsc are now skipped in `next build`
  # (next.config.mjs) since CI gates them, so this no longer has to cover that step. #932
  #
  # Raised 4096 -> 6144 when ADR 24 added two route trees and the deploy preview
  # started failing while `next build` still succeeded locally at 4096 and in CI.
  # The standard build image has 8 GB, so this stays inside the container cap.
  NODE_OPTIONS = "--max-old-space-size=6144"

# The call-filter packages are browser-only and must not ride into the server
# function (#1134).
#
# `___netlify-server-handler` is built from Next's output trace, and AWS refuses
# the upload once it is too large:
#
#   Failed to create function: invalid parameter for function creation:
#   Invalid AWS Lambda parameters used in this request.
#
# The BUILD succeeds; this fails at the deploy stage. That is why every required
# check stayed green through seven consecutive failures and why `next build`
# reproduces nothing locally — the broken stage never runs on a laptop.
#
# The real weight is 74MB of node_modules (audio-filters-web 44MB,
# video-filters-web 30MB), excluded via `outputFileTracingExcludes` in
# next.config.mjs. The `public/` exclusion below is kept because 32MB of WASM
# and models have no business in a Lambda either — but it was NOT the fix, and
# saying so here matters: the resolved Netlify config showed it applied while
# the deploy still failed.
#
# Netlify has no `excluded_files` key; exclusion is a `!` entry in
# `included_files`.
[functions]
  included_files = ["!public/mediapipe/**", "!public/nc-models/**"]

# Skip builds for Dependabot PRs
[context.deploy-preview]
  ignore = """
    # Check if this is a Dependabot branch
    if echo "$HEAD" | grep -q "^dependabot/"; then
      echo "Skipping deploy preview for Dependabot branch: $HEAD"
      exit 0
    fi

    # Check if the commit author is Dependabot
    if git log --format="%an" -n 1 | grep -q "dependabot"; then
      echo "Skipping deploy preview for Dependabot commit"
      exit 0
    fi

    # Continue with normal build for non-Dependabot PRs
    exit 1
  """
