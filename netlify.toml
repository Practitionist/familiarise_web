[build]
  # Build command for production
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Node version
  NODE_VERSION = "22"
  # Heap headroom for the webpack build. Lint + tsc are now skipped in `next build`
  # (next.config.mjs) since CI gates them, so this no longer has to cover that step. #932
  #
  # 4096 was tried for #1795 and REVERTED: the webpack compile phase needs
  # >4 GB heap (FATAL "Reached heap limit" ~2.5 min into "Creating an optimized
  # production build", exit 2 — a V8-limit death, not the RSS kill). This flag
  # binds the parent/compile process; prerender workers spawn with
  # isolatedMemory (flag stripped, uncapped — see vercel/next.js#95744), so the
  # static-phase RSS risk is handled by staticGenerationMaxConcurrency=4 +
  # on-demand ISR + enablePrerenderSourceMaps=false instead. Raised 4096 ->
  # 6144 when ADR 24 added two route trees; the 8 GB image tolerates it as long
  # as prerender RSS stays capped.
  NODE_OPTIONS = "--max-old-space-size=6656"

# ─────────────────────────────────────────────────────────────────────────────
# Function memory / #1124 stall — RESOLVED IN next.config.mjs (#1972).
#
# Root cause of the #1124 ~24–32s cold-start stall and the 2026-10-03 504
# outage: `@netlify/plugin-nextjs` v5 runs `NextNodeServer` with
# `minimalMode: false` (unlike Vercel's `minimalMode: true`), which caused
# `new NextNodeServer()` to synchronously execute `unstable_preloadEntries()`
# and `preloadAppDocument()` across all 606 routes (1,676,071 `webpackRequire`
# calls, ~500+ MB V8 heap) on every cold Lambda start. Note also that
# `[build.environment] NODE_OPTIONS` above applies ONLY at build time; at
# runtime on 1024 MB Lambda containers, Node 22 caps V8 old-space at 512 MB.
#
# Setting `experimental.preloadEntriesOnStart: false` and
# `experimental.appDocumentPreloading: false` in `next.config.mjs` (#1972)
# reduced cold-start `/api/perf/probe-bare` from ~29.5–37.6s (512 MB heap) to
# 0.97–1.90s (33 MB heap) across a 12-request concurrent cold burst.
#
# Why 2048 MB function memory is NOT set here:
# Raising handler memory (`[functions."___netlify-server-handler"] memory = 2048`)
# was A/B tested on 2026-08-22 (deploy 6a8954981e6f) and doubled GB-hour
# billing without fixing the preload stall; reverted in 08b10ce4.
#
# GOTCHA: runtime API v2 (@netlify/plugin-nextjs 5.x) generates ONE function
# named `___netlify-server-handler`. The classic `___netlify-handler` /
# `___netlify-odb-handler` names belong to v4 and match NOTHING, and classic
# `[functions] included_files` / `external_node_modules` keys in netlify.toml
# are silently ignored by `@netlify/plugin-nextjs` v5 (use
# `outputFileTracingExcludes` / `outputFileTracingIncludes` in next.config.mjs).
# Full record: docs/deployment/netlify.md (Section 14).
# ─────────────────────────────────────────────────────────────────────────────

# Skip builds for Dependabot PRs
[context.deploy-preview]
  ignore = """
    # Check if this is a Dependabot branch
    if echo "$HEAD" | grep -q "^dependabot/"; then
      echo "Skipping deploy preview for Dependabot branch: $HEAD"
      exit 0
    fi

    # Check if the commit author is Dependabot
    if git log --format="%an" -n 1 | grep -q "dependabot"; then
      echo "Skipping deploy preview for Dependabot commit"
      exit 0
    fi

    # Continue with normal build for non-Dependabot PRs
    exit 1
  """

# Serve immutable static assets directly from Netlify Edge CDN cache
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/avif/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
