[build]
  # Build command for production
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Node version
  NODE_VERSION = "22"
  # Heap headroom for the webpack build. Lint + tsc are now skipped in `next build`
  # (next.config.mjs) since CI gates them, so this no longer has to cover that step. #932
  #
  # Raised 4096 -> 6144 when ADR 24 added two route trees and the deploy preview
  # started failing while `next build` still succeeded locally at 4096 and in CI.
  # The standard build image has 8 GB, so this stays inside the container cap.
  NODE_OPTIONS = "--max-old-space-size=6144"

# The call-filter assets are browser-only, and must not ride into the server
# function (#1134).
#
# `postinstall` copies ~32MB of MediaPipe WASM and Krisp models into `public/`
# so the browser fetches them from us instead of unpkg. Netlify builds
# `___netlify-server-handler` from Next's standalone output, which copies
# `public/` wholesale — so all 32MB landed inside a Lambda that never serves
# them, and AWS rejected the upload:
#
#   Failed to create function: invalid parameter for function creation:
#   Invalid AWS Lambda parameters used in this request.
#
# The build itself SUCCEEDS. This fails at the deploy stage, which is why every
# required check stayed green while the deploy preview failed seven times in a
# row — and why `next build` reproduces nothing locally.
#
# Excluded here rather than moved out of `public/`: the CDN still serves them at
# `/mediapipe` and `/nc-models`, which is exactly what `basePath` expects.
# Netlify has no `excluded_files` key; exclusion is a `!` entry in
# `included_files`.
[functions]
  included_files = ["!public/mediapipe/**", "!public/nc-models/**"]

# Skip builds for Dependabot PRs
[context.deploy-preview]
  ignore = """
    # Check if this is a Dependabot branch
    if echo "$HEAD" | grep -q "^dependabot/"; then
      echo "Skipping deploy preview for Dependabot branch: $HEAD"
      exit 0
    fi

    # Check if the commit author is Dependabot
    if git log --format="%an" -n 1 | grep -q "dependabot"; then
      echo "Skipping deploy preview for Dependabot commit"
      exit 0
    fi

    # Continue with normal build for non-Dependabot PRs
    exit 1
  """
